# Site settings
title: Microsoft AI Decision Framework
description: Comprehensive guide to navigating Microsoft's AI technology portfolio
baseurl: "/Microsoft-AI-Decision-Framework" # the subpath of your site, e.g. /blog
url: "https://microsoft.github.io" # the base hostname & protocol for your site

# Theme
# Pinned to a release so upstream selector changes can't silently undo the
# light/dark bridge in _sass/color_schemes/aidf.scss. Upgrade deliberately:
# bump the tag, rebuild, and compare both themes before merging.
remote_theme: just-the-docs/just-the-docs@v0.12.0

# For local testing (uncomment the line below and comment out remote_theme):
# theme: just-the-docs

# Color scheme. "aidf" (_sass/color_schemes/aidf.scss) routes the theme's
# colors through CSS custom properties, so readers can switch between light
# and dark at runtime from the header (default: follow the OS). The palettes
# live in _sass/custom/custom.scss. Just the Docs itself has no toggle.
color_scheme: aidf

# Logo (optional - add your logo to /images/ folder)
# Using official Microsoft logo SVG from Wikimedia Commons (vector format, scales perfectly)
logo: "/images/microsoft-logo.svg"

# Favicon - high-quality 256x256px icon at root (browsers auto-detect /favicon.ico)
# Leave unset to use /favicon.ico automatically
# favicon_ico: "/favicon.ico"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Mermaid diagrams support
# Using latest stable version from https://github.com/mermaid-js/mermaid/releases
# Last verified: November 2025
mermaid:
  version: "11.12.1"

# Navigation
nav_sort: case_sensitive

# Footer content
footer_content: "Copyright &copy; 2025. This documentation is based on official Microsoft sources and best practices."

# External links
aux_links:
  "View on GitHub":
    - "//github.com/microsoft/Microsoft-AI-Decision-Framework"

# Quick links in header
aux_links_new_tab: true

# Enable/disable components
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# Kramdown settings
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Sass compiler settings (quiet dependency warnings from upstream theme)
sass:
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jekyll-include-cache
  - jekyll-remote-theme

# Exclude React Flow explorer source from Jekyll processing
exclude:
  - explorer/node_modules
  - explorer/src
  - explorer/package.json
  - explorer/package-lock.json
  - explorer/tsconfig.json
  - explorer/vite.config.ts
  - explorer/.gitignore
  - AGENTS.md
