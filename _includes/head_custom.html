<!-- Webfonts.
     Loaded here rather than via an @import inside custom.scss: a CSS @import
     can only be discovered after the theme stylesheet has been fetched and
     parsed, which serialises two round trips before any text can paint.
     A <link> in <head> is fetched in parallel with the theme CSS instead. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">

<script src="https://cdn.jsdelivr.net/npm/mermaid@{{ site.mermaid.version | default: '11.12.1' }}/dist/mermaid.min.js"></script>
<script>
  // Initialize Mermaid and convert fenced mermaid code blocks to renderable diagrams.
  document.addEventListener('DOMContentLoaded', () => {
    if (!window.mermaid) return;

    const mermaidConfig = Object.assign(
      { startOnLoad: false, securityLevel: 'loose' },
      {% include mermaid_config.js %}
    );

    const codeBlocks = Array.from(
      document.querySelectorAll(
        'pre > code.language-mermaid, div.language-mermaid.highlighter-rouge pre > code'
      )
    );
    codeBlocks.forEach((codeBlock) => {
      const container = document.createElement('div');
      container.classList.add('mermaid');
      container.innerHTML = codeBlock.textContent;
      const mermaidWrapper = codeBlock.closest('div.language-mermaid.highlighter-rouge');
      const pre = codeBlock.parentElement;
      (mermaidWrapper || pre).replaceWith(container);
    });

    mermaid.initialize(mermaidConfig);
    mermaid.run({ querySelector: '.mermaid' });
  });
</script>
<!-- "On this page" rail.
     Loaded as a static asset rather than inlined via {% raw %}{% include %}{% endraw %}: the built HTML is
     served with newlines stripped, which would collapse the script onto one
     line and let its first // comment swallow the rest of the file. -->
<script src="{{ '/assets/js/page-toc.js' | relative_url }}" defer></script>
<style>
  /* Hide the theme footer inside the sidebar */
  body > .side-bar > footer.site-footer {
    display: none !important;
  }
</style>
